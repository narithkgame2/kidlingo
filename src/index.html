<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kidlingo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Kidlingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/*@@STYLES@@*/
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <button class="icon-btn" id="homeBtn" aria-label="Back">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="counter" title="はなまる"><span id="hmSlot"></span><span id="hanaN">0</span></div>
    <div class="counter" title="Days in a row">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#F2B233"/><g stroke="#F2B233" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
      <span id="streakN">0</span><small>にち</small>
    </div>
    <button class="icon-btn warn-btn" id="soundWarn" aria-label="Sound isn't playing" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4v14l-5-4h-4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn speed-btn" id="speedBtn" aria-label="はやさ (ゆっくり / ふつう)" aria-pressed="false">🐇</button>
    <button class="icon-btn" id="lockBtn" aria-label="Grown-ups">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>
<canvas id="fx"></canvas>

<script id="kl-audio" type="application/json">/*@@AUDIO@@*/</script>
<script>
/*@@DATA@@*/
/*@@APP@@*/
</script>
</body>
</html>
